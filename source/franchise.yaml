# Franchise configuration for the profile factory.
# Fill in per-franchise before building. `series_labels` maps each persona
# series key to its display label; `series_skins` holds a 13-color terminal
# palette per series for the skin generator.

name: "Middle-earth"
author: "JPeetz"
rights_holder: "the Tolkien Estate and its respective rights holders"
rights_note: >-
  Unofficial, non-commercial fan-made behavioral collection for Hermes Agent.
  No franchise logos, artwork, scripts, actor likenesses, maps, or copied
  dialogue. Middle-earth, its characters, and its setting are the property of
  the Tolkien Estate and its respective rights holders. Not affiliated with
  or endorsed by them.

